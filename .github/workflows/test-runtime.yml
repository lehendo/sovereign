name: Runtime Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'src/**'

jobs:
  test-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
            os: "macos"
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
            os: "macos"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
            os: "windows"
          - platform: "ubuntu-latest"
            args: ""
            target: "x86_64-unknown-linux-gnu"
            os: "linux"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Tesseract
        if: matrix.os == 'linux'
        run: |
          sudo apt-get install -y tesseract-ocr

      - name: Install Tesseract (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install tesseract

      - name: Install Tesseract (Windows)
        if: matrix.os == 'windows'
        run: |
          choco install tesseract -y

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: |
          npm run tauri build -- ${{ matrix.args }} || exit 1

      - name: Verify artifacts exist
        run: |
          if [ "${{ matrix.os }}" = "macos" ]; then
            ls "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"*.dmg >/dev/null 2>&1 || exit 1
            ls "src-tauri/target/${{ matrix.target }}/release/bundle/macos/"*.app >/dev/null 2>&1 || exit 1
          elif [ "${{ matrix.os }}" = "windows" ]; then
            ls "src-tauri/target/${{ matrix.target }}/release/bundle/msi/"*.msi >/dev/null 2>&1 || exit 1
          elif [ "${{ matrix.os }}" = "linux" ]; then
            ls "src-tauri/target/${{ matrix.target }}/release/bundle/deb/"*.deb >/dev/null 2>&1 || exit 1
            ls "src-tauri/target/${{ matrix.target }}/release/bundle/appimage/"*.AppImage >/dev/null 2>&1 || exit 1
          fi

      - name: Test app launch (macOS)
        if: matrix.os == 'macos'
        run: |
          APP_PATH=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -name "*.app" | head -1)
          echo "Testing app: $APP_PATH"
          # Try to launch (will fail without display, but verifies binary works)
          "$APP_PATH/Contents/MacOS/sovereign" --version || echo "App binary exists and is executable"

      - name: Test app launch (Windows)
        if: matrix.os == 'windows'
        run: |
          MSI_PATH=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/msi" -name "*.msi" | head -1)
          echo "MSI installer created: $MSI_PATH"
          # Verify MSI is valid
          file "$MSI_PATH" || echo "MSI file exists"

      - name: Test app launch (Linux)
        if: matrix.os == 'linux'
        run: |
          APPIMAGE_PATH=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/appimage" -name "*.AppImage" | head -1)
          echo "Testing AppImage: $APPIMAGE_PATH"
          chmod +x "$APPIMAGE_PATH"
          # Try to get version (will fail without display, but verifies binary works)
          "$APPIMAGE_PATH" --version 2>&1 || echo "AppImage is executable and binary works"

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.os }}-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
          retention-days: 7

