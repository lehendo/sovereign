name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.1.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
            os: "macos"
            arch: "x64"
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
            os: "macos"
            arch: "arm64"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
            os: "windows"
            arch: "x64"
          - platform: "ubuntu-latest"
            args: ""
            target: "x86_64-unknown-linux-gnu"
            os: "linux"
            arch: "x64"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify winget availability (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Write-Host "Checking winget availability..."
          winget --version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "winget is not available. This is required for Tesseract installation."
            exit 1
          }
          Write-Host "✓ winget is available"

      - name: Bundle Tesseract for Windows
        if: matrix.os == 'windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          .\scripts\setup-tesseract-win.ps1

      - name: Create placeholder tesseract-win directory (non-Windows)
        if: matrix.os != 'windows'
        run: |
          mkdir -p src-tauri/resources/tesseract-win
          # Create a placeholder file so the directory isn't empty
          touch src-tauri/resources/tesseract-win/.gitkeep

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_PUBLIC_KEY: ${{ secrets.TAURI_PUBLIC_KEY }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Sovereign ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false

      - name: Generate and upload latest.json
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          # Find the built artifact (check both possible paths)
          ARTIFACT=""
          if [ "${{ matrix.os }}" = "macos" ]; then
            if [ -d "src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" 2>/dev/null | head -1)
            fi
            if [ -z "$ARTIFACT" ] && [ -d "src-tauri/target/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/release/bundle -name "*.dmg" 2>/dev/null | head -1)
            fi
          elif [ "${{ matrix.os }}" = "windows" ]; then
            if [ -d "src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.msi" 2>/dev/null | head -1)
            fi
            if [ -z "$ARTIFACT" ] && [ -d "src-tauri/target/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/release/bundle -name "*.msi" 2>/dev/null | head -1)
            fi
          else
            # For Linux, prefer .deb over .AppImage
            if [ -d "src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.deb" 2>/dev/null | head -1)
            fi
            if [ -z "$ARTIFACT" ] && [ -d "src-tauri/target/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/release/bundle -name "*.deb" 2>/dev/null | head -1)
            fi
            if [ -z "$ARTIFACT" ] && [ -d "src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.AppImage" 2>/dev/null | head -1)
            fi
            if [ -z "$ARTIFACT" ] && [ -d "src-tauri/target/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/release/bundle -name "*.AppImage" 2>/dev/null | head -1)
            fi
          fi
          
          if [ -z "$ARTIFACT" ]; then
            echo "No artifact found, skipping latest.json generation"
            exit 0
          fi
          
          echo "Found artifact: $ARTIFACT"
          
          # Set up variables
          ARTIFACT_DIR=$(dirname "$ARTIFACT")
          ARTIFACT_NAME=$(basename "$ARTIFACT")
          SIG_FILE="${ARTIFACT}.sig"
          
          # Check if signature file already exists
          if [ -f "$SIG_FILE" ]; then
            echo "Found signature file: $SIG_FILE"
          else
            # Search for signature file in alternative locations
            echo "Signature file not found at $SIG_FILE, searching alternative locations..."
            FOUND_SIG=$(find "$ARTIFACT_DIR" -name "${ARTIFACT_NAME}.sig" 2>/dev/null | head -1)
            if [ -n "$FOUND_SIG" ] && [ -f "$FOUND_SIG" ]; then
              SIG_FILE="$FOUND_SIG"
              echo "Found signature file at: $SIG_FILE"
            else
              # Search more broadly for any .sig files
              FOUND_SIG=$(find src-tauri/target -name "*.sig" -path "*/bundle/*" 2>/dev/null | head -1)
              if [ -n "$FOUND_SIG" ] && [ -f "$FOUND_SIG" ]; then
                SIG_FILE="$FOUND_SIG"
                echo "Found signature file at: $SIG_FILE"
              else
                # No signature found, need to create one
                echo "No signature file found. Signing artifact now..."
                SIG_FILE="${ARTIFACT}.sig"
                
                # Write private key to a temporary file
                # Handle both PEM format (with newlines) and base64 format (single line)
                PRIVATE_KEY_FILE=$(mktemp)
                PRIVATE_KEY_CONTENT="${{ secrets.TAURI_PRIVATE_KEY }}"
                
                # Write the key preserving its original format
                # If it starts with "-----BEGIN", it's PEM format and needs newlines
                # Otherwise, it's likely base64 and should be a single line
                if echo "$PRIVATE_KEY_CONTENT" | grep -q "^-----BEGIN"; then
                  # PEM format - preserve as-is
                  echo "$PRIVATE_KEY_CONTENT" > "$PRIVATE_KEY_FILE"
                else
                  # Base64 format - ensure it's a single line (remove newlines but keep content)
                  echo "$PRIVATE_KEY_CONTENT" | tr -d '\n\r' > "$PRIVATE_KEY_FILE"
                fi
                
                # Verify the key file was written correctly
                if [ ! -s "$PRIVATE_KEY_FILE" ]; then
                  echo "Error: Private key file is empty"
                  rm -f "$PRIVATE_KEY_FILE"
                  exit 1
                fi
                
                echo "Signing artifact: $ARTIFACT"
                echo "Key file size: $(wc -c < "$PRIVATE_KEY_FILE") bytes"
                
                # Sign the artifact - try with file path first
                SIGN_OUTPUT=$(npx @tauri-apps/cli signer sign "$ARTIFACT" \
                  --private-key-path "$PRIVATE_KEY_FILE" \
                  --password "$TAURI_KEY_PASSWORD" 2>&1)
                SIGN_EXIT_CODE=$?
                
                if [ $SIGN_EXIT_CODE -ne 0 ]; then
                  echo "Error: tauri signer failed with exit code $SIGN_EXIT_CODE"
                  echo "Signer output:"
                  echo "$SIGN_OUTPUT"
                  rm -f "$PRIVATE_KEY_FILE"
                  exit 1
                fi
                
                # Clean up temp file
                rm -f "$PRIVATE_KEY_FILE"
                
                # Verify signature was created
                if [ ! -f "$SIG_FILE" ]; then
                  echo "Error: Signature file not found after signing: $SIG_FILE"
                  echo "Listing files in artifact directory:"
                  ls -la "$ARTIFACT_DIR" || true
                  echo "Searching for any .sig files:"
                  find "$ARTIFACT_DIR" -name "*.sig" 2>/dev/null || true
                  exit 1
                fi
                echo "Successfully created signature file: $SIG_FILE"
              fi
            fi
          fi
          
          # Read the signature file (remove newlines - signatures are base64 single-line)
          SIGNATURE=$(cat "$SIG_FILE" | tr -d '\n\r')
          
          if [ -z "$SIGNATURE" ]; then
            echo "Error: Signature is empty"
            exit 1
          fi
          
          # Get version from tauri.conf.json
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          
          if [ -z "$VERSION" ]; then
            echo "Error: Version is empty"
            exit 1
          fi
          
          # Determine platform and architecture
          if [ "${{ matrix.os }}" = "macos" ]; then
            PLATFORM="darwin"
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              ARCH="aarch64"
            else
              ARCH="x86_64"
            fi
            EXT="dmg"
          elif [ "${{ matrix.os }}" = "windows" ]; then
            PLATFORM="windows"
            ARCH="x86_64"
            EXT="msi"
          else
            PLATFORM="linux"
            ARCH="x86_64"
            EXT="deb"
          fi
          
          # Get the release URL
          RELEASE_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/$ARTIFACT_NAME"
          
          echo "Creating latest.json with:"
          echo "  Version: $VERSION"
          echo "  Platform: $PLATFORM"
          echo "  Arch: $ARCH"
          echo "  Release URL: $RELEASE_URL"
          echo "  Signature length: ${#SIGNATURE} characters"
          
          # Create platform-specific JSON entry
          PLATFORM_KEY="${PLATFORM}-${ARCH}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          echo "Platform entry for $PLATFORM_KEY:"
          echo "  Signature: ${SIGNATURE:0:50}..."
          echo "  URL: $RELEASE_URL"
          
          # Download existing latest.json if it exists, or create new one
          # Use artifact directory for temp file to avoid Windows path issues
          LATEST_JSON_TEMP="${ARTIFACT_DIR}/.latest_json_temp_$$"
          RELEASE_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          
          # Write signature to temp file to safely pass it to Node.js (signature is already base64)
          # Use artifact directory instead of system temp for better cross-platform compatibility
          SIGNATURE_TEMP="${ARTIFACT_DIR}/.signature_temp_$$"
          echo -n "$SIGNATURE" > "$SIGNATURE_TEMP"
          
          # Verify signature file was written
          if [ ! -f "$SIGNATURE_TEMP" ] || [ ! -s "$SIGNATURE_TEMP" ]; then
            echo "Error: Signature temp file not created or is empty"
            echo "Attempted path: $SIGNATURE_TEMP"
            ls -la "$ARTIFACT_DIR" || true
            exit 1
          fi
          
          echo "Signature temp file created: $SIGNATURE_TEMP ($(wc -c < "$SIGNATURE_TEMP") bytes)"
          
          # Try to download existing latest.json
          LATEST_JSON_URL=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.name == "latest.json") | .url' 2>/dev/null | head -1)
          
          if [ -n "$LATEST_JSON_URL" ]; then
            echo "Found latest.json URL: $LATEST_JSON_URL"
            # Download with retry and verify it's valid JSON
            if curl -sL -f -o "$LATEST_JSON_TEMP" "$LATEST_JSON_URL" 2>/dev/null && [ -s "$LATEST_JSON_TEMP" ]; then
              # Verify it's valid JSON before using it
              if node -e "JSON.parse(require('fs').readFileSync('$LATEST_JSON_TEMP', 'utf8'))" 2>/dev/null; then
                echo "Found existing latest.json, merging platform entry..."
                # Merge the new platform entry into existing JSON
                node -e "
                  const fs = require('fs');
                  const path = require('path');
                  if (!fs.existsSync('$SIGNATURE_TEMP')) {
                    console.error('Error: Signature temp file does not exist: $SIGNATURE_TEMP');
                    process.exit(1);
                  }
                  const data = JSON.parse(fs.readFileSync('$LATEST_JSON_TEMP', 'utf8'));
                  if (!data.platforms) data.platforms = {};
                  const signature = fs.readFileSync('$SIGNATURE_TEMP', 'utf8');
                  if (!signature || signature.length === 0) {
                    console.error('Error: Signature is empty');
                    process.exit(1);
                  }
                  data.platforms['$PLATFORM_KEY'] = {
                    signature: signature,
                    url: '$RELEASE_URL'
                  };
                  // Update pub_date to most recent
                  data.pub_date = '$PUB_DATE';
                  fs.writeFileSync('$LATEST_JSON_TEMP', JSON.stringify(data, null, 2));
                " || {
                  echo "Error: Failed to merge platform entry"
                  exit 1
                }
              else
                echo "Downloaded latest.json is invalid JSON, creating new one..."
                rm -f "$LATEST_JSON_TEMP"
                LATEST_JSON_TEMP="${ARTIFACT_DIR}/.latest_json_temp_$$"
                # Create new latest.json with this platform
                node -e "
                  const fs = require('fs');
                  if (!fs.existsSync('$SIGNATURE_TEMP')) {
                    console.error('Error: Signature temp file does not exist: $SIGNATURE_TEMP');
                    process.exit(1);
                  }
                  const signature = fs.readFileSync('$SIGNATURE_TEMP', 'utf8');
                  if (!signature || signature.length === 0) {
                    console.error('Error: Signature is empty');
                    process.exit(1);
                  }
                  const data = {
                    version: '$VERSION',
                    notes: 'See the assets to download this version and install.',
                    pub_date: '$PUB_DATE',
                    platforms: {
                      '$PLATFORM_KEY': {
                        signature: signature,
                        url: '$RELEASE_URL'
                      }
                    }
                  };
                  fs.writeFileSync('$LATEST_JSON_TEMP', JSON.stringify(data, null, 2));
                " || {
                  echo "Error: Failed to create latest.json"
                  exit 1
                }
              fi
            else
              echo "Failed to download existing latest.json, creating new one..."
              rm -f "$LATEST_JSON_TEMP"
              LATEST_JSON_TEMP="${ARTIFACT_DIR}/.latest_json_temp_$$"
              # Create new latest.json with this platform
              node -e "
                const fs = require('fs');
                if (!fs.existsSync('$SIGNATURE_TEMP')) {
                  console.error('Error: Signature temp file does not exist: $SIGNATURE_TEMP');
                  process.exit(1);
                }
                const signature = fs.readFileSync('$SIGNATURE_TEMP', 'utf8');
                if (!signature || signature.length === 0) {
                  console.error('Error: Signature is empty');
                  process.exit(1);
                }
                const data = {
                  version: '$VERSION',
                  notes: 'See the assets to download this version and install.',
                  pub_date: '$PUB_DATE',
                  platforms: {
                    '$PLATFORM_KEY': {
                      signature: signature,
                      url: '$RELEASE_URL'
                    }
                  }
                };
                fs.writeFileSync('$LATEST_JSON_TEMP', JSON.stringify(data, null, 2));
              " || {
                echo "Error: Failed to create latest.json"
                exit 1
              }
            fi
          else
            echo "No existing latest.json found, creating new one..."
            # Create new latest.json with this platform
            node -e "
              const fs = require('fs');
              if (!fs.existsSync('$SIGNATURE_TEMP')) {
                console.error('Error: Signature temp file does not exist: $SIGNATURE_TEMP');
                process.exit(1);
              }
              const signature = fs.readFileSync('$SIGNATURE_TEMP', 'utf8');
              if (!signature || signature.length === 0) {
                console.error('Error: Signature is empty');
                process.exit(1);
              }
              const data = {
                version: '$VERSION',
                notes: 'See the assets to download this version and install.',
                pub_date: '$PUB_DATE',
                platforms: {
                  '$PLATFORM_KEY': {
                    signature: signature,
                    url: '$RELEASE_URL'
                  }
                }
              };
              fs.writeFileSync('$LATEST_JSON_TEMP', JSON.stringify(data, null, 2));
            " || {
              echo "Error: Failed to create latest.json"
              exit 1
            }
          fi
          
          # Clean up signature temp file after Node.js is done (ensure it exists first)
          if [ -f "$SIGNATURE_TEMP" ]; then
            rm -f "$SIGNATURE_TEMP"
          fi
          
          # Verify JSON is valid
          if ! node -e "JSON.parse(require('fs').readFileSync('$LATEST_JSON_TEMP', 'utf8'))" 2>/dev/null; then
            echo "Error: Merged latest.json is not valid JSON"
            cat "$LATEST_JSON_TEMP"
            rm -f "$LATEST_JSON_TEMP"
            exit 1
          fi
          
          echo "Merged latest.json:"
          cat "$LATEST_JSON_TEMP"
          
          # Upload latest.json to release (clobber to overwrite with merged version)
          echo "Uploading merged latest.json to release..."
          if ! gh release upload "$RELEASE_TAG" "$LATEST_JSON_TEMP" --clobber; then
            echo "Error: Failed to upload latest.json"
            rm -f "$LATEST_JSON_TEMP"
            exit 1
          fi
          
          rm -f "$LATEST_JSON_TEMP"
          echo "Successfully uploaded merged latest.json to release"

