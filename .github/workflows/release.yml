name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.1.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
            os: "macos"
            arch: "x64"
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
            os: "macos"
            arch: "arm64"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
            os: "windows"
            arch: "x64"
          - platform: "ubuntu-latest"
            args: ""
            target: "x86_64-unknown-linux-gnu"
            os: "linux"
            arch: "x64"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify winget availability (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Write-Host "Checking winget availability..."
          winget --version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "winget is not available. This is required for Tesseract installation."
            exit 1
          }
          Write-Host "✓ winget is available"

      - name: Bundle Tesseract for Windows
        if: matrix.os == 'windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          .\scripts\setup-tesseract-win.ps1

      - name: Create placeholder tesseract-win directory (non-Windows)
        if: matrix.os != 'windows'
        run: |
          mkdir -p src-tauri/resources/tesseract-win
          # Create a placeholder file so the directory isn't empty
          touch src-tauri/resources/tesseract-win/.gitkeep

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_PUBLIC_KEY: ${{ secrets.TAURI_PUBLIC_KEY }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Sovereign ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false

      - name: Generate and upload latest.json
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          # Find the built artifact (check both possible paths)
          ARTIFACT=""
          if [ "${{ matrix.os }}" = "macos" ]; then
            if [ -d "src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" 2>/dev/null | head -1)
            fi
            if [ -z "$ARTIFACT" ] && [ -d "src-tauri/target/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/release/bundle -name "*.dmg" 2>/dev/null | head -1)
            fi
          elif [ "${{ matrix.os }}" = "windows" ]; then
            if [ -d "src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.msi" 2>/dev/null | head -1)
            fi
            if [ -z "$ARTIFACT" ] && [ -d "src-tauri/target/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/release/bundle -name "*.msi" 2>/dev/null | head -1)
            fi
          else
            # For Linux, prefer .deb over .AppImage
            if [ -d "src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.deb" 2>/dev/null | head -1)
            fi
            if [ -z "$ARTIFACT" ] && [ -d "src-tauri/target/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/release/bundle -name "*.deb" 2>/dev/null | head -1)
            fi
            if [ -z "$ARTIFACT" ] && [ -d "src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.AppImage" 2>/dev/null | head -1)
            fi
            if [ -z "$ARTIFACT" ] && [ -d "src-tauri/target/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/release/bundle -name "*.AppImage" 2>/dev/null | head -1)
            fi
          fi
          
          if [ -z "$ARTIFACT" ]; then
            echo "No artifact found, skipping latest.json generation"
            exit 0
          fi
          
          echo "Found artifact: $ARTIFACT"
          
          # Set up variables
          ARTIFACT_DIR=$(dirname "$ARTIFACT")
          ARTIFACT_NAME=$(basename "$ARTIFACT")
          SIG_FILE="${ARTIFACT}.sig"
          
          # Check if artifact is already signed by tauri-action
          if [ -f "$SIG_FILE" ]; then
            echo "Artifact already signed by tauri-action, using existing signature"
          else
            # Sign the artifact ourselves
            # Write private key to a temporary file (preserve newlines and special characters)
            PRIVATE_KEY_FILE=$(mktemp)
            # Store the key in a variable first, then write it preserving all characters
            PRIVATE_KEY_CONTENT="${{ secrets.TAURI_PRIVATE_KEY }}"
            # Use printf with %b to interpret escape sequences, or just write directly
            printf '%s' "$PRIVATE_KEY_CONTENT" > "$PRIVATE_KEY_FILE"
            
            # Verify the key file was written correctly
            if [ ! -s "$PRIVATE_KEY_FILE" ]; then
              echo "Error: Private key file is empty"
              rm -f "$PRIVATE_KEY_FILE"
              exit 1
            fi
            
            # Sign the artifact (don't set TAURI_PRIVATE_KEY env var to avoid conflicts)
            npx @tauri-apps/cli signer sign "$ARTIFACT" \
              --private-key-path "$PRIVATE_KEY_FILE" \
              --password "$TAURI_KEY_PASSWORD" 2>&1 || {
              echo "Error: tauri signer failed"
              echo "Debug: Key file size: $(wc -c < "$PRIVATE_KEY_FILE") bytes"
              echo "Debug: First 100 chars of key file:"
              head -c 100 "$PRIVATE_KEY_FILE" || true
              rm -f "$PRIVATE_KEY_FILE"
              exit 1
            }
            
            # Clean up temp file
            rm -f "$PRIVATE_KEY_FILE"
            
            # Verify signature was created
            if [ ! -f "$SIG_FILE" ]; then
              echo "Error: Signature file not found after signing: $SIG_FILE"
              exit 1
            fi
          fi
          
          # Read the signature file
          SIGNATURE=$(cat "$SIG_FILE" | tr -d '\n')
          
          # Get version from tauri.conf.json
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          
          # Determine platform and architecture
          if [ "${{ matrix.os }}" = "macos" ]; then
            PLATFORM="darwin"
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              ARCH="aarch64"
            else
              ARCH="x86_64"
            fi
            EXT="dmg"
          elif [ "${{ matrix.os }}" = "windows" ]; then
            PLATFORM="windows"
            ARCH="x86_64"
            EXT="msi"
          else
            PLATFORM="linux"
            ARCH="x86_64"
            EXT="deb"
          fi
          
          # Get the release URL
          RELEASE_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/$ARTIFACT_NAME"
          
          # Create latest.json
          LATEST_JSON="${ARTIFACT_DIR}/latest.json"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Use printf to avoid YAML heredoc issues
          printf '{\n  "version": "%s",\n  "notes": "See the assets to download this version and install.",\n  "pub_date": "%s",\n  "platforms": {\n    "%s-%s": {\n      "signature": "%s",\n      "url": "%s"\n    }\n  }\n}' "$VERSION" "$PUB_DATE" "$PLATFORM" "$ARCH" "$SIGNATURE" "$RELEASE_URL" > "$LATEST_JSON"
          
          echo "Generated latest.json:"
          cat "$LATEST_JSON"
          
          # Upload latest.json to release
          gh release upload "${{ github.event.inputs.tag || github.ref_name }}" "$LATEST_JSON" --clobber || echo "Failed to upload latest.json"

