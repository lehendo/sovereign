name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
            os: "macos"
            arch: "x64"
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
            os: "macos"
            arch: "arm64"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
            os: "windows"
            arch: "x64"
          - platform: "ubuntu-latest"
            args: ""
            target: "x86_64-unknown-linux-gnu"
            os: "linux"
            arch: "x64"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify winget availability (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Write-Host "Checking winget availability..."
          winget --version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "winget is not available. This is required for Tesseract installation."
            exit 1
          }
          Write-Host "✓ winget is available"

      - name: Bundle Tesseract for Windows
        if: matrix.os == 'windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          .\scripts\setup-tesseract-win.ps1

      - name: Create placeholder tesseract-win directory (non-Windows)
        if: matrix.os != 'windows'
        run: |
          mkdir -p src-tauri/resources/tesseract-win
          # Create a placeholder file so the directory isn't empty
          touch src-tauri/resources/tesseract-win/.gitkeep

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_PUBLIC_KEY: ${{ secrets.TAURI_PUBLIC_KEY }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Sovereign ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false

      - name: Generate and upload latest.json
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          # Find the built artifact (check both possible paths)
          ARTIFACT=""
          if [ "${{ matrix.os }}" = "macos" ]; then
            if [ -d "src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" 2>/dev/null | head -1)
            fi
            if [ -z "$ARTIFACT" ] && [ -d "src-tauri/target/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/release/bundle -name "*.dmg" 2>/dev/null | head -1)
            fi
          elif [ "${{ matrix.os }}" = "windows" ]; then
            if [ -d "src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.msi" 2>/dev/null | head -1)
            fi
            if [ -z "$ARTIFACT" ] && [ -d "src-tauri/target/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/release/bundle -name "*.msi" 2>/dev/null | head -1)
            fi
          else
            # For Linux, prefer .deb over .AppImage
            if [ -d "src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.deb" 2>/dev/null | head -1)
            fi
            if [ -z "$ARTIFACT" ] && [ -d "src-tauri/target/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/release/bundle -name "*.deb" 2>/dev/null | head -1)
            fi
            if [ -z "$ARTIFACT" ] && [ -d "src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.AppImage" 2>/dev/null | head -1)
            fi
            if [ -z "$ARTIFACT" ] && [ -d "src-tauri/target/release/bundle" ]; then
              ARTIFACT=$(find src-tauri/target/release/bundle -name "*.AppImage" 2>/dev/null | head -1)
            fi
          fi
          
          if [ -z "$ARTIFACT" ]; then
            echo "No artifact found, skipping latest.json generation"
            exit 0
          fi
          
          echo "Found artifact: $ARTIFACT"
          
          # Create output directory
          mkdir -p /tmp/updater-manifests
          
          # Sign the artifact
          ARTIFACT_DIR=$(dirname "$ARTIFACT")
          ARTIFACT_NAME=$(basename "$ARTIFACT")
          
          # Write private key to a temporary file
          PRIVATE_KEY_FILE=$(mktemp)
          echo "$TAURI_PRIVATE_KEY" > "$PRIVATE_KEY_FILE"
          
          # Sign the artifact
          npx @tauri-apps/cli signer sign "$ARTIFACT" \
            --private-key-path "$PRIVATE_KEY_FILE" \
            --password "$TAURI_KEY_PASSWORD" 2>&1 || {
            echo "Warning: tauri signer failed"
            rm -f "$PRIVATE_KEY_FILE"
            exit 0
          }
          
          # Clean up temp file
          rm -f "$PRIVATE_KEY_FILE"
          
          # Read the signature file
          SIG_FILE="${ARTIFACT}.sig"
          if [ ! -f "$SIG_FILE" ]; then
            echo "Error: Signature file not found: $SIG_FILE"
            exit 0
          fi
          
          SIGNATURE=$(cat "$SIG_FILE" | tr -d '\n')
          
          # Get version from tauri.conf.json
          VERSION=$(node -p "require('../tauri.conf.json').version")
          
          # Determine platform and architecture
          if [ "${{ matrix.os }}" = "macos" ]; then
            PLATFORM="darwin"
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              ARCH="aarch64"
            else
              ARCH="x86_64"
            fi
            EXT="dmg"
          elif [ "${{ matrix.os }}" = "windows" ]; then
            PLATFORM="windows"
            ARCH="x86_64"
            EXT="msi"
          else
            PLATFORM="linux"
            ARCH="x86_64"
            EXT="deb"
          fi
          
          # Get the release URL
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$ARTIFACT_NAME"
          
          # Create latest.json
          LATEST_JSON="${ARTIFACT_DIR}/latest.json"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > "$LATEST_JSON" << 'JSONEOF'
{
  "version": "VERSION_PLACEHOLDER",
  "notes": "See the assets to download this version and install.",
  "pub_date": "DATE_PLACEHOLDER",
  "platforms": {
    "PLATFORM_PLACEHOLDER": {
      "signature": "SIGNATURE_PLACEHOLDER",
      "url": "URL_PLACEHOLDER"
    }
  }
}
JSONEOF
          # Replace placeholders
          sed -i.bak "s|VERSION_PLACEHOLDER|$VERSION|g" "$LATEST_JSON"
          sed -i.bak "s|DATE_PLACEHOLDER|$PUB_DATE|g" "$LATEST_JSON"
          sed -i.bak "s|PLATFORM_PLACEHOLDER|${PLATFORM}-${ARCH}|g" "$LATEST_JSON"
          sed -i.bak "s|SIGNATURE_PLACEHOLDER|$SIGNATURE|g" "$LATEST_JSON"
          sed -i.bak "s|URL_PLACEHOLDER|$RELEASE_URL|g" "$LATEST_JSON"
          rm -f "${LATEST_JSON}.bak"
          
          echo "Generated latest.json:"
          cat "$LATEST_JSON"
          
          # Upload latest.json to release
          gh release upload "${{ github.ref_name }}" "$LATEST_JSON" --clobber || echo "Failed to upload latest.json"

