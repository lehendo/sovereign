name: Test Builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'package.json'

jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
            os: "macos"
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
            os: "macos"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
            os: "windows"
          - platform: "ubuntu-latest"
            args: ""
            target: "x86_64-unknown-linux-gnu"
            os: "linux"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (test only)
        run: |
          npm run tauri build -- ${{ matrix.args }} || exit 1
        continue-on-error: false

      - name: Verify artifact exists
        run: |
          if [ "${{ matrix.os }}" = "macos" ]; then
            test -f "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"*.dmg || exit 1
          elif [ "${{ matrix.os }}" = "windows" ]; then
            test -f "src-tauri/target/${{ matrix.target }}/release/bundle/msi/"*.msi || exit 1
          elif [ "${{ matrix.os }}" = "linux" ]; then
            test -f "src-tauri/target/${{ matrix.target }}/release/bundle/deb/"*.deb || exit 1
          fi

