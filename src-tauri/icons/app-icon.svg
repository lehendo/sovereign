<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.25" r="0.75">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="highlight" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect x="80" y="80" width="864" height="864" rx="190" ry="190" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect x="80" y="80" width="864" height="864" fill="url(#bg)"/>
    <rect x="80" y="80" width="864" height="864" fill="url(#glow)"/>
    <image xlink:href="logo.svg" x="212" y="212" width="600" height="600" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <rect x="80" y="80" width="864" height="864" rx="190" ry="190" fill="url(#highlight)" opacity="0.2"/>
</svg>

