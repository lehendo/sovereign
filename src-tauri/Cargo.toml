[package]
name = "sovereign"
version = "1.1.0"
description = "Privacy-first screen memory tool"
author = ["Arjun Chatterjee"]
edition = "2021"

[lib]
name = "sovereign_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset"] }
tauri-plugin-updater = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
xcap = "0.0.12"
image = "0.25"
webp = "0.3"
image_hasher = "2.0"
anyhow = "1.0"
fastembed = "4.1.0"
rusty-tesseract = "1.1"
dirs = "5.0"
rusqlite = { version = "0.32", features = ["bundled"] }
bincode = "1.3"
chrono = "0.4"
tempfile = "3.10"
base64 = "0.22"

